name: NodeJs application pipeline

on:
  push:
    branches:
    - main
    - master
    - "feature/**"
  pull_request:
    branches:
    - main
    - master
    - "feature/**"

jobs:
  nodeJS-CI:
    runs-on: ubuntu-latest
    steps:
    - name: checkout repo
      uses: actions/checkout@v7

    - name: setup nodeJs at Machine
      uses: actions/setup-node@v7

    - name: running test
      run: npm test
